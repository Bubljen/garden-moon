<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garden Moon Calendar</title>
<meta name="description" content="Maria Thun biodynamic sowing calendars: Canterbury NZ, 坎特伯雷, Slovenija, 東京.">
<script>if (/^#[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(location.hash)) location.replace("canterbury/" + location.hash);</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root{--ground:#F1F3EE;--surface:#FFFFFF;--ink:#1F2621;--muted:#626C66;--rule:#D9DED7;--accent:#2F7D4F}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--ground:#0F1418;--surface:#161E24;--ink:#E5E8E3;--muted:#98A39D;--rule:#27323A;--accent:#62B587}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;padding-inline:20px;padding-block:48px}
main{max-width:640px;margin:0 auto;display:grid;gap:24px}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(30px,6vw,44px);margin:0}
p{margin:0;color:var(--muted);line-height:1.5}
.cards{display:grid;gap:12px}
.card{display:grid;gap:2px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.name{font-family:"Young Serif",Georgia,serif;font-size:24px}
.what{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <div><h1>Garden Moon Calendar</h1>
  <p>Maria Thun biodynamic sowing calendars · 月亮播种日历 · Setveni koledarji · 種まきカレンダー</p></div>
  <nav class="cards"><a class="card" href="canterbury/" lang="en"><span class="name">Canterbury</span><span class="what">Christchurch &amp; Canterbury, Aotearoa NZ · English</span></a><a class="card" href="canterbury/zh/" lang="zh-Hans"><span class="name">坎特伯雷</span><span class="what">基督城和坎特伯雷 · 中文</span></a><a class="card" href="slovenia/" lang="sl"><span class="name">Slovenija</span><span class="what">Setveni koledar za vso Slovenijo · slovensko</span></a><a class="card" href="tokyo/" lang="ja"><span class="name">東京・関東</span><span class="what">Tokyo &amp; Kantō, Japan · 日本語</span></a></nav>
</main>
</body>
</html>
